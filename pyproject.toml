[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-file-organizer-auditor"
version = "1.0.0"
description = "Non-destructive local file & folder audit, duplicate detector, and organization advisor for Windows"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Local File Organizer & Auditor Team" }
]
dependencies = [
    "send2trash>=1.8.2",
    "rich>=13.0.0",
]

[project.scripts]
local-organizer = "local_organizer.cli:main"
